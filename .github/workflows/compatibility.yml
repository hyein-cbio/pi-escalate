name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *" # Monthly: day 1 at 05:00 UTC

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Pi compatibility on Modal
    # Fork PRs cannot access Modal tokens. Do not use pull_request_target to bypass this.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install Modal SDK
        run: python -m pip install -r ci/requirements.txt
      - name: Run both Pi host checks in one Modal App
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [[ -z "$MODAL_TOKEN_ID" || -z "$MODAL_TOKEN_SECRET" ]]; then
            echo "::error::Set MODAL_TOKEN_ID and MODAL_TOKEN_SECRET as repository or organization Actions secrets."
            exit 1
          fi
          modal run ci/modal_ci.py::matrix
